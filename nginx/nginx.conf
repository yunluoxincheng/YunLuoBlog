events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|json)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri =404;
        }

        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri =404;
        }

        location /albums/ {
            try_files $uri $uri/ /albums/index.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
