services:
  nginx:
    image: nginx:alpine
    container_name: yunluoblog-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./yunluoblog-web/dist:/usr/share/nginx/html:ro
      - ./uploads:/app/uploads:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
